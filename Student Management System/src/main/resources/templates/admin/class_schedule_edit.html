<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Schedule</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
          rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">

<!-- Navbar -->
<div th:replace="~{fragments/admin_navbar :: navbar}"></div>

<div id="content-wrapper" class="d-flex flex-column">
    <div id="content">
        <div class="container-fluid">

            <h1 class="h3 mb-4 text-gray-800"
                th:text="'Schedule for Class ' + ${classObj.grade} + ${classObj.section}"></h1>

            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Edit Schedule</h6>
                </div>
                <div class="card-body">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <form th:action="@{'/admin/class_schedule/' + ${classObj.classId} + '/save'}" method="post">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead>
                                <tr>
                                    <th>Time</th>
                                    <th th:each="d : ${days}" th:text="${d}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="slot : ${slots}">
                                    <td th:text="${slot}"></td>
                                    <td th:each="day : ${days}">
                                        <select class="form-control"
                                                th:name="${'cell_' + day.name() + '_' + slot.replace(':','').replace('-','_')}">
                                            <option value="0">-- Empty --</option>
                                            <option th:each="sub : ${subjects}"
                                                    th:value="${sub.subjectId}"
                                                    th:text="${sub.subjectName}"
                                                    th:selected="${selectedSubjects[day.name() + '_' + slot.replace(':','').replace('-','_')] == sub.subjectId}">
                                            </option>
                                        </select>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <button type="submit" class="btn btn-success">Save timetable</button>
                        <a th:href="@{/admin/viewClasses}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

</body>
</html>
