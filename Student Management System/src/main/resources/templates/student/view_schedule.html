<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Schedule for Class ' + ${classObj.grade} + '' + ${classObj.section}">Schedule</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
          rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">

<!-- Student Navbar -->
<div th:replace="~{fragments/student_navbar :: navbar}"></div>

<div id="content-wrapper" class="d-flex flex-column">
    <div id="content" class="container-fluid">

        <h1 class="h3 mb-4 text-gray-800"
            th:text="'Schedule for Class ' + ${classObj.grade} + '' + ${classObj.section}"></h1>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Weekly Schedule</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered text-center">
                        <thead>
                        <tr>
                            <th>Time</th>
                            <th th:each="d : ${days}" th:text="${d}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="slot : ${slots}">
                            <td th:text="${slot}"></td>
                            <td th:each="day : ${days}">
                                <span th:text="${displayCells[day.name() + '_' + slot.replace(':','').replace('-','_')]}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <a th:href="@{/student/dashboard}" class="btn btn-secondary mt-3">Back</a>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
